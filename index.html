<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Timed Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      padding-top: 40px;
    }
    .quiz {
      background: white;
      padding: 20px;
      width: 350px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    button {
      width: 100%;
      margin: 6px 0;
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    .timer {
      font-weight: bold;
      text-align: right;
    }
  </style>
</head>
<body>

<div class="quiz">
  <div class="timer">Time: <span id="time">15</span>s</div>
  <h2 id="question"></h2>
  <div id="answers"></div>
  <p id="result"></p>
</div>

<script>
  const questions = [
    {
      q: "What is the capital of France?",
      a: ["Paris", "Berlin", "Rome", "Madrid"],
      correct: 0
    },
    {
      q: "Which planet is red?",
      a: ["Earth", "Mars", "Venus", "Jupiter"],
      correct: 1
    }
  ];

  let index = 0;
  let score = 0;
  let time = 15;
  let timer;

  function showQuestion() {
    time = 15;
    document.getElementById("time").textContent = time;
    document.getElementById("question").textContent = questions[index].q;

    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    questions[index].a.forEach((text, i) => {
      const btn = document.createElement("button");
      btn.textContent = text;
      btn.onclick = () => chooseAnswer(i);
      answersDiv.appendChild(btn);
    });

    timer = setInterval(() => {
      time--;
      document.getElementById("time").textContent = time;
      if (time === 0) nextQuestion();
    }, 1000);
  }

  function chooseAnswer(i) {
    if (i === questions[index].correct) score++;
    nextQuestion();
  }

  function nextQuestion() {
    clearInterval(timer);
    index++;
    if (index < questions.length) {
      showQuestion();
    } else {
      document.querySelector(".quiz").innerHTML =
        `<h2>Finished!</h2><p>Your score: ${score}/${questions.length}</p>`;
    }
  }

  showQuestion();
</script>

</body>
</html>
