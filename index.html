<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>5-Second Timed Math Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      padding-top: 40px;
    }
    .quiz {
      background: white;
      padding: 20px;
      width: 380px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .timer {
      text-align: right;
      font-weight: bold;
      color: #d9534f;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    button {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>


<div class="quiz">
  <div class="timer">Time left: <span id="time">5</span>s</div>
  <h3 id="question"></h3>
  <input type="text" id="answer" placeholder="Type your answer" autocomplete="off" />
  <button onclick="submitAnswer()">Submit</button>
</div>


<script>
  const questions = [
    { q: "How many sides does a square have?", a: "4" },
    { q: "What is 1 less than 44?", a: "43" },
    { q: "What is half of 16?", a: "8" },
    { q: "Write down a multiple of 5", a: "5" },
    { q: "Write in figures: four hundred and nine", a: "409" }
  ];

  let current = 0;
  let score = 0;
  let time = 5;
  let countdown;
  function showQuestion() {
    document.getElementById("question").textContent = questions[current].q;
    document.getElementById("answer").value = "";
    time = 5;
    document.getElementById("time").textContent = time;
    countdown = setInterval(() => {
      time--;
      document.getElementById("time").textContent = time;
      if (time === 0) submitAnswer();
    }, 1000);
  }
  function submitAnswer() {
    clearInterval(countdown);
    const userAnswer = document.getElementById("answer").value.trim();
    if (userAnswer !== "" && userAnswer == questions[current].a) {
      score++;
    }

    current++;
    if (current < questions.length) {
      showQuestion();
    } else {
      document.querySelector(".quiz").innerHTML = `
        <h2>Quiz Complete ✅</h2>
        <p>Your score: ${score} / ${questions.length}</p>
        <button onclick="location.reload()">Restart Quiz</button>
      `;
    }
  }

  showQuestion();
</script>


</body>
